[package]
name = "pulsetrace"
version = "0.1.0"
description = "Analisador local de registros de sensores HWiNFO64"
authors = ["PulseTrace contributors"]
edition = "2021"

[lib]
name = "pulsetrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
